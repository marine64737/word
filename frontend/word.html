<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>Word</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 40px;
      }
      nav {
        background-color: #04fff2;
        font-weight: bold;
        padding: 10px;
        text-align: left;
        margin-bottom: 40px;
      }
      nav a {
        color: black;
        margin: 0 15px;
        text-decoration: none;
        font-size: 18px;
        padding: 10px;
      }
      nav a:hover {
        background-color: #ffcc00;
        padding: 10px;
      }
      h1,
      h2 {
        color: #333;
      }
      .profile {
        display: flex;
        align-items: center;
      }
      .profile img {
        /*border-radius: 60%;*/
        width: 240px;
        margin-right: 20px;
      }
      .kor-meaning-align {
        display: block;
        text-align: left;
      }
      .hidden {
        display: none;
      }
      table {
        border-collapse: collapse;
      }
      table,
      td,
      th {
        border: 1px solid #bbb;
      }
      td,
      th {
        padding: 10px;
        text-align: center;
      }
      form {
        margin-top: 30px;
      }
      input,
      textarea {
        width: 300px;
        padding: 8px;
        margin: 8px 0;
      }
      table {
        table-layout: auto; /* 테이블 레이아웃 고정 */
        width: auto; /* 전체 너비 지정 */
        border-collapse: collapse;
      }
      /* 배경 바 */
      .progress-container {
        width: 100%;
        background-color: #e0e0e0;
        border-radius: 8px;
        overflow: hidden;
        margin-bottom: 10px;
      }

      /* 채워지는 게이지 바 */
      .progress-bar {
        width: 0%; /* 처음에는 0%로 시작 */
        height: 24px;
        background-color: #4caf50; /* 초록색 */
        border-radius: 8px 0 0 8px;
        transition: width 0.3s ease-in-out; /* 부드러운 애니메이션 효과 */
      }

      /* 텍스트 스타일 */
      .progress-text {
        font-family: sans-serif;
        font-size: 14px;
        color: #333;
      }
    </style>
  </head>
  <body>
    <h1>Word</h1>
    <button class="word-mode" data-mode="0" style="font-size: 1em">
      일본어 단어
    </button>
    <button class="word-mode" data-mode="1" style="font-size: 1em">
      일본어 한자
    </button>
    <button class="word-mode" data-mode="2" style="font-size: 1em">
      영어 단어
    </button>
    <!--     <h2 id="word-title">일본어 단어장 <span id="total-count" style="font-size: 0.5em; color: gray;"></span>
    <span style="font-size: 0.5em; color: gray;" id="word-url">source: github.com/elzup/jlpt-word-list/blob/master/out/all.csv#L1</span>
    </h2> -->
    <h2 id="word-title">
      <span id="title-text">일본어 단어장 </span>
      <span id="total-count" style="font-size: 0.5em; color: gray"></span>
      <span id="word-url" style="font-size: 0.5em; color: gray"
        >source: ...</span
      >
    </h2>
    <!-- 진행률을 감싸는 컨테이너 -->
    <div class="progress-container">
      <!-- 실시간으로 가로 길이가 변할 게이지 -->
      <div id="progress-bar" class="progress-bar"></div>
    </div>

    <!-- 수치를 텍스트로 보여줄 공간 -->
    <!-- <div class="progress-text">
    <span id="pass">0</span>
    <span id="total">100</span>
    (<span id="percentage">0%</span>)
    </div> -->
    <!--<h2>확인한 단어 <span id="pass-count" style="font-size: 0.5em; color: gray;"></span></h2>-->
    <div class="hidden input-group">
      <h2>단어 추가</h2>
      <input type="text" id="kanji" placeholder="한자 (Kanji)" />
      <input type="text" id="reading" placeholder="읽기 (Reading)" />
      <input type="text" id="meaning" placeholder="의미 (Meaning)" />
      <button id="checkWord" class="voca-action">중복확인</button>
      <button id="saveWord" class="voca-action">저장하기</button>
      <span id="message-area" style="margin-left: 10px"></span>
    </div>
    <div class="hidden search">
      <h2>단어 수정</h2>
      <input type="text" id="search-kanji" placeholder="한자 (Kanji)" />
      <button id="searchWord" class="voca-action">검색</button>
      <button class="hidden voca-action" id="cancel">취소</button>
      <button id="clearInput" class="voca-action">클리어</button>
      <!-- <span id="search-message" style="margin-left: 10px;"></span> -->
    </div>
    <div id="search-result"></div>
    <div
      style="display: flex; justify-content: space-between; align-items: center"
    >
      <div>
        <button id="refresh" class="voca-action" style="font-size: 1em">
          새로고침
        </button>
        <button id="revealAll" class="voca-action" style="font-size: 1em">
          전체 보기
        </button>
      </div>
      <span id="search-message" style="margin-left: 10px"></span>
      <button
        id="ankiInit"
        class="voca-action"
        style="font-size: 1em; color: red"
      >
        암기 초기화
      </button>
    </div>

    <table id="init" border="1" style="width: 100%; border-collapse: collapse">
      <!--         <colgroup>
            <col style="width: 300px;">
            <col style="width: 200px;">
            <col style="width: auto;">
            <col style="width: 80px;">
            <col style="width: 100px;">
        </colgroup>
    <thead>
        <tr>
            <th>한자</th>
            <th>읽기</th>
            <th>의미(한국어)</th>
            <th>암기</th>
            <th>어려움</th>
        </tr>
    </thead>
    <tbody id="word-list">
    </tbody> -->
    </table>
    <button id="refresh" class="voca-action" style="font-size: 1em">
      새로고침
    </button>
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
